# Build-only CI. There is deliberately NO deploy step -- see linux.yml for why.
#
# The upstream version of this file also codesigned and notarized the bundle with
# seven Apple secrets and then uploaded it to Open Ephys's Artifactory. None of
# those credentials belong to this project, and it signed `ephys-socket.bundle`,
# a filename this repo no longer produces.
name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-mac:
    runs-on: [macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build && cmake -G "Xcode" ..

    - name: build
      run: |
        cd Build
        cmake -G "Xcode" ..
        xcodebuild -configuration Release
