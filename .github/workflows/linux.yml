# Build-only CI. There is deliberately NO deploy step.
#
# This repo is a fork of open-ephys/ephys-socket, and the upstream workflows end
# by uploading to openephys.jfrog.io/artifactory/EphysSocket-plugin/... using
# secrets.ARTIFACTORY_ACCESS_TOKEN -- an Open Ephys org credential, under their
# package name. That is their release pipeline, not ours: running it here would
# publish GLANCE builds into their artifact namespace. If you ever sync a
# workflow from upstream, drop the deploy step again.
#
# What these jobs are for: proving the plugin still compiles. All three platforms
# are kept because Source/IntanInterface.cpp carries real _WIN32 and __APPLE__
# branches (winsock2 vs POSIX sockets, closesocket, the Apple-specific paths in
# IntanSocket.cpp) that a Linux-only build cannot exercise.
name: linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-linux:
    runs-on: [ubuntu-22.04]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: setup
      run: |
        sudo apt update
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        sudo ./plugin-GUI/Resources/Scripts/install_linux_dependencies.sh
        cd plugin-GUI/Build && cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..

    - name: build
      run: |
        cd Build
        cmake -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release ..
        make
