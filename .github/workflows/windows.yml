# Build-only CI. There is deliberately NO deploy step -- see linux.yml for why.
name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-windows:
    # PINNED, not windows-latest. The generator below is "Visual Studio 17 2022",
    # and windows-latest has moved to an image that ships a different Visual
    # Studio -- cmake then fails setup with "could not find any instance of
    # Visual Studio" before any of our code is compiled.
    #
    # Pinning is preferred over bumping the generator because the setup step
    # downloads open-ephys-lib-v1.0.0.zip, a PREBUILT binary. Building against a
    # newer MSVC toolset risks a link failure against that lib, which is a much
    # more confusing symptom than this one. If this image is ever retired, bump
    # the runner and the generator together and check that the lib still links.
    runs-on: [windows-2022]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: setup
      run: |
        cd ../..
        git clone https://github.com/open-ephys/plugin-GUI.git --branch main
        cd plugin-GUI/Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
        mkdir Release && cd Release
        curl -L https://openephys.jfrog.io/artifactory/GUI-binaries/Libraries/open-ephys-lib-v1.0.0.zip --output open-ephys-lib.zip
        unzip open-ephys-lib.zip
      shell: bash

    - name: configure
      run: |
        cd Build
        cmake -G "Visual Studio 17 2022" -A x64 ..
      shell: bash

    # Still on the Node 20 runtime, hence the deprecation warning on this job.
    # Left pinned deliberately: a newer major may not exist, and an invalid tag
    # turns a warning into a hard failure. Bump only after checking the
    # marketplace.
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: build-plugin
      run: |
        cd Build
        msbuild INSTALL.vcxproj -p:Configuration=Release -p:Platform=x64
      shell: cmd
